<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lever Application</title></head>
<body>
  <div class="application-form">
    <label for="lever-name">Full Name</label>
    <input id="lever-name" name="name" type="text" />
    <label for="lever-email">Email</label>
    <input id="lever-email" name="email" type="email" />
    <label for="lever-phone">Phone</label>
    <input id="lever-phone" name="phone" type="tel" />
    <label for="lever-linkedin">LinkedIn</label>
    <input id="lever-linkedin" name="urls[LinkedIn]" type="url" />
    <label for="lever-org">How did you hear about us?</label>
    <select id="lever-org" name="org" aria-label="How did you hear about us?">
      <option value="">Select one</option>
      <option value="linkedin">LinkedIn</option>
      <option value="referral">Referral</option>
    </select>
    <fieldset>
      <legend>Sponsorship required?</legend>
      <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
      <label><input type="radio" name="sponsorship" value="no" /> No</label>
    </fieldset>
    <label><input type="checkbox" id="lever-privacy" name="privacy" /> I accept the privacy policy</label>
    <label for="lever-gender">Gender identity (voluntary)</label>
    <select id="lever-gender" name="gender" aria-label="Gender identity">
      <option value="">Prefer not to say</option>
      <option value="nonbinary">Non-binary</option>
    </select>
    <button type="submit">Submit application</button>
  </div>
</body>
</html>
