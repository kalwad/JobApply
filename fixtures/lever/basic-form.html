<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lever Application</title></head>
<body>
  <div class="application-form">
    <label for="lever-name">Full Name</label>
    <input id="lever-name" name="name" type="text" />
    <label for="lever-email">Email</label>
    <input id="lever-email" name="email" type="email" />
    <label for="lever-phone">Phone</label>
    <input id="lever-phone" name="phone" type="tel" />
    <label for="lever-linkedin">LinkedIn</label>
    <input id="lever-linkedin" name="urls[LinkedIn]" type="url" />
    <button type="submit">Submit application</button>
  </div>
</body>
</html>
