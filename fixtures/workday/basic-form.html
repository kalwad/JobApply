<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Workday Application</title></head>
<body>
  <form id="workday-application">
    <input data-automation-id="legalNameSection_firstName" id="wd-first" name="firstName" type="text" aria-label="First Name" />
    <input data-automation-id="legalNameSection_lastName" id="wd-last" name="lastName" type="text" aria-label="Last Name" />
    <input data-automation-id="email" id="wd-email" name="email" type="email" aria-label="Email Address" />
    <input data-automation-id="phone-number" id="wd-phone" name="phone" type="tel" aria-label="Phone Number" />
    <input data-automation-id="addressSection_addressLine1" id="wd-addr1" type="text" aria-label="Address Line 1" />
    <input data-automation-id="addressSection_city" id="wd-city" type="text" aria-label="City" />
    <input data-automation-id="addressSection_postalCode" id="wd-zip" type="text" aria-label="Postal Code" />
    <button type="submit" data-automation-id="bottom-navigation-next-button">Next</button>
  </form>
</body>
</html>
